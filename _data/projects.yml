- title: Human-Wildlife Coexistence in Iran
  show_on_map: true
  location: Iran
  coordinates: [36.2605, 59.6168]
  status: Ongoing
  summary: Multiple Projects. We are investigating human-wildlife coexistence, focusing on species that often interact with humans, such as brown bears and bee-eaters. We are linking spatial modeling with human dimensions to understand the drivers of human-wildlife interactions and identify strategies for coexistence.
