- title: Habitat and connectivity
  question: How do species select habitat and how does landscape change affect the connections between populations?

- title: Human–wildlife coexistence
  question: How does human activity shape wildlife habitat, and how can conservation account for the people who share the same landscapes as wildlife?
  image: /assets/img/research-interests/coexistence.jpg
  image_alt: Honeybees gathering at the entrance of a wooden hive surrounded by vegetation.

- title: Coupled systems
  question: How do ecological and social processes interact across local and global scales, and how do systems influence each other across those scales?
  image: /assets/img/research-interests/coupled-systems.jpg
  image_alt: Agricultural fields, homes, and forest sharing a mountain valley landscape.

- title: Spatial conservation
  question: How can we design and implement conservation strategies that effectively manage and protect biodiversity across spatial scales?
